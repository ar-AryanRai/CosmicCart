<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/33ce17bf2c.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./cart.css">
  <link rel="stylesheet" href="./nav.css">
</head>

<body class="bg-[url('./images/Backgrounds/bearth.jpg')] bg-cover w-[100vw] h-[100vh] text-white">

  <div
    class="pop fixed top-10 lg:left-[45%] lg:right-[35%] left-[25px] right-[25px] flex items-center justify-center rounded-3xl hidden z-50 bg-blue-200 text-black font-bold h-[60px]">
    <span>Item Removed Successfully</span>
  </div>

  <div
    class="applied fixed top-10 lg:left-[45%] lg:right-[35%] left-[25px] right-[25px] flex items-center justify-center rounded-3xl hidden z-50 bg-blue-200 text-black font-bold h-[60px]">
    <span>Coupon Applied Successfully</span>
  </div>

  <div
    class="not-applied fixed top-10 lg:left-[45%] lg:right-[35%] left-[25px] right-[25px] flex items-center justify-center rounded-3xl hidden z-50 bg-blue-200 text-black font-bold h-[60px]">
    <span>Coupon Is Not Valid</span>
  </div>

  <div
    class="bought fixed top-10 lg:left-[45%] lg:right-[35%] left-[25px] right-[25px] flex items-center justify-center rounded-3xl hidden z-50 bg-blue-200 text-black font-bold h-[60px]">
    <span>Item Bought Successfully</span>
  </div>


  <nav class="flex items-center justify-between w-[100%] h-[12%]">
    <div class="ml-4 company-logo w-[50%] lg:w-[16%] h-[90%] overflow-hidden">
      <img class="logo w-[100%] h-[100%]" src="./images/logo.png" alt="Logo of our company space odyssey" />
    </div>

    <!-- remove the hidden class from below div -->
    <div class="options hidden lg:block lg:flex lg:justify-evenly lg:w-[30%] lg:text-lg">
      <div class="home">Home</div>
      <div class="about">About Us</div>
      <div class="offers">Offers</div>
      <div class="cart px-2 rounded-sm">
        <i class="fa-solid fa-cart-shopping mr-2" style="color: #ffffff;"></i> Cart
      </div>
    </div>

    <div class="bars lg:hidden md:hidden mr-1">
      <i class="fa-solid fa-bars text-2xl mx-4"></i>
    </div>
  </nav>

  <div class="dropside hidden z-50 fixed top-[0px] right-0 w-[100%] h-[100%] lg:hidden md:hidden">
    <div class="company-logo w-[100%] h-[12%] flex justify-between items-center">
      <img class="logo ml-4 w-[50%] h-[90%]" src="./images/logo.png" alt="Logo of our company space odyssey" />
      <i class="close fa-solid fa-circle-xmark text-3xl mx-4" style="color:#ffffff;"></i>
    </div>

    <div class="dropdown w-[100%] h-[40%] flex flex-col justify-evenly text-xl">
      <div class="home1 h-[25%] flex justify-center items-center">Home</div>
      <div class="about1 h-[25%] flex justify-center items-center">About Us</div>
      <div class="offers1 h-[25%] flex justify-center items-center">Offers</div>
      <div class="cart1 px-2 rounded-sm h-[25%] flex justify-center items-center">
        <i class="fa-solid fa-cart-shopping mr-2"></i> Cart
      </div>
    </div>
  </div>

  <main class="p-4 lg:p-12 flex flex-col w-[100%] justify-between">
    <div class="products-in-cart w-[100%] lg:w-[68%] flex flex-col justify-start lg:mr-2">

    </div>


    <div class="calc w-[100%] lg:w-[30%]">
      <div class="oferr-bill w-[100%]">
        <div class="bill lg:w-[420px] h-[200px] border-2 rounded-lg p-2">
          <div class="border-b-2 h-[18%] text-center">
            <h1 class="text-xl font-bold h-[100%] text-[#002211]">Price Details </h1>
          </div>
          <div class="text-md h-[82%]">
            <div class="flex justify-between">
              <span>Total</span>
              <span class="tprice"></span>
            </div>
            <div class="flex justify-between">
              <span>Discount on MRP</span>
              <span class="dprice"></span>
            </div>
            <div class="flex justify-between">
              <span>Discounted Price</span>
              <span class="ddprice"></span>
            </div>
            <div class="flex justify-between">
              <span>Coupon Discount</span>
              <span class="cdprice"></span>
            </div>
            <div class="flex justify-between">
              <span>Convenience Charge</span>
              <span class="cprice"></span>
            </div>

            <div class="border-t-2 flex justify-between">
              <span class="flabel">Final Price: </span>
              <span class="fprice"></span>
            </div>
          </div>
        </div>

        <div class="offer w-[100%] rounded-lg lg:w-[420px] mt-4 border-2 py-2">
          <div class="value flex justify-evenly mb-2">
            <label for="of" class="py-2">Coupon Code: </label>
            <input id="of" class="in py-2 w-[280px] bg-blue-100 rounded-lg text-center text-black font-medium"
              type="text" placeholder="Enter the Coupon Code">
          </div>
          <div class="valid flex justify-center">
            <div class="apply bg-green-100 text-black font-medium text-center w-[100px] cursor-pointer rounded-lg ml-4">
              APPLY</div>
          </div>
        </div>
        <div class="mt-4 flex justify-center">
          <div class="buyBtn border-2 bg-green-100 text-black font-bold px-8 rounded-lg cursor-pointer">Buy Now</div>
        </div>
      </div>
    </div>
  </main>

  <script src="./nav.js"></script>
  <script src="./coupons.js"></script>
  <script src="./api.js"></script>
  <script src="./cart.js"></script>
</body>

</html>
